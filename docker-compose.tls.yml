# Automatic-HTTPS edge overlay. This file is mandatory in production.
# Use `make prod-config`, `make prod-release`, then `make prod-up`.
#
# TLS_MODE selects how Caddy obtains a certificate:
#   acme     public Let's Encrypt / ZeroSSL (default; needs public DNS + 80/443)
#   internal Caddy local CA for LAN/Proxmox names that cannot complete ACME
#   file     operator-supplied PEM files mounted from TLS_*_FILE_HOST

services:
  nginx:
    ports: !reset []

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:?Set TLS_DOMAIN in the selected environment file}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in the selected environment file}
      TLS_HSTS: ${TLS_HSTS:-max-age=31536000}
      TLS_MODE: ${TLS_MODE:-acme}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ${TLS_CERT_FILE_HOST:-/dev/null}:/certs/fullchain.pem:ro
      - ${TLS_KEY_FILE_HOST:-/dev/null}:/certs/privkey.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2020/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
          pids: 128
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:
