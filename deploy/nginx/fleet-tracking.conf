# Prefer the proto reported by an upstream TLS proxy (e.g. Caddy/Traefik) and
# fall back to the local scheme when Nginx is the edge. This keeps Django's
# SECURE_PROXY_SSL_HEADER detection correct in both deployment modes.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~." $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Media is intentionally not served directly. Uploaded photos, signatures,
    # and generated PDFs are delivered through authenticated Django download
    # endpoints (/api/v1/media/<id>/download/) so access stays authorized.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
