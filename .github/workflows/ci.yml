name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Generate Python CycloneDX SBOM
        run: |
          mkdir -p ../artifacts
          python -m pip_audit \
            --requirement requirements.txt \
            --format cyclonedx-json \
            --output ../artifacts/python-sbom.cdx.json
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
      - name: Run Django deploy check
        env:
          ENVIRONMENT: production
          DJANGO_SECRET_KEY: ci-secret-key-with-enough-entropy-1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DATABASE_URL: sqlite:////tmp/fleet_tracking_ci.sqlite3
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          PUBLIC_BASE_URL: https://example.com
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy
      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: artifacts/python-sbom.cdx.json
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate deployment assets
        run: ./scripts/validate-deployment.sh

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build ${{ matrix.component }} image
        run: docker build --tag fleet-${{ matrix.component }}:ci "${{ matrix.context }}"
      - name: Scan ${{ matrix.component }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fleet-${{ matrix.component }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate container CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fleet-${{ matrix.component }}:ci
          format: cyclonedx
          output: ${{ matrix.component }}-sbom.cdx.json
          scanners: vuln
      - name: Upload container SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.component }}-sbom
          path: ${{ matrix.component }}-sbom.cdx.json
          retention-days: 30
